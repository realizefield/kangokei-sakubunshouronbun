<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看護学校 作文・小論文 GAMBA</title>
<style>
:root{
  --bg:#f3fbff; --card:#ffffff; --ink:#26364a; --sub:#5d7089;
  --blue:#3aa9e8; --blue-d:#1f86c4; --blue-l:#e0f3fd;
  --sun:#ffc93c; --sun-l:#fff6d6; --coral:#ff7a6b; --coral-l:#ffe8e4;
  --mint:#4cc9a0; --mint-l:#e0f7ef; --line:#d7e8f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;font-size:16px}
header{background:linear-gradient(135deg,#3aa9e8,#6fd0f5);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:.04em}
header p{margin:2px 0 0;font-size:13px;opacity:.95}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px 8px}
nav button{flex:0 0 auto;border:0;background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
nav button.on{background:var(--blue);color:#fff}
main{max-width:860px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h2{font-size:19px;margin:0 0 8px;color:var(--blue-d)}
h3{font-size:16px;margin:14px 0 4px;color:var(--ink)}
.warn{background:var(--coral-l);border:2px solid var(--coral);border-radius:14px;padding:14px}
.warn b{color:#c8402f}
.tip{background:var(--sun-l);border-left:6px solid var(--sun);padding:10px 12px;border-radius:8px;margin:10px 0}
.ok{background:var(--mint-l);border-left:6px solid var(--mint);padding:10px 12px;border-radius:8px;margin:10px 0}
.btn{display:inline-block;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:12px 20px;border-radius:12px;cursor:pointer;font-family:inherit}
.btn.sun{background:var(--sun);color:#5a4200}
.btn.line{background:#fff;color:var(--blue-d);border:2px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.tile{display:block;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;cursor:pointer;font-family:inherit;color:inherit}
.tile:hover{border-color:var(--blue)}
.tile .ic{font-size:26px}
.tile b{display:block;font-size:17px;color:var(--blue-d)}
label{display:block;font-weight:700;margin:14px 0 4px}
label small{font-weight:400;color:var(--sub)}
input[type=text],input[type=number],select,textarea{width:100%;font-size:16px;font-family:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;background:#fcfeff;color:var(--ink)}
textarea{min-height:92px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;background:var(--blue-l);border-radius:999px;padding:6px 12px}
.chk input{width:auto}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:6px}
.b-sei{background:var(--blue-l);color:var(--blue-d)} .b-jun{background:var(--mint-l);color:#1d8b69} .b-stop{background:var(--coral-l);color:#c8402f}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pill{background:var(--sun-l);border:1px solid var(--sun);border-radius:999px;padding:2px 10px;font-size:13px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.cmp th{background:var(--blue-l);color:var(--blue-d);position:sticky;top:0}
.scroll{overflow-x:auto;border-radius:10px}
.kv{display:grid;grid-template-columns:8.5em 1fr;gap:4px 10px;font-size:15px}
.kv dt{font-weight:700;color:var(--sub)} .kv dd{margin:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--mint)}
pre.ex{white-space:pre-wrap;font-family:inherit;background:var(--blue-l);border-radius:10px;padding:10px;margin:6px 0}
.small{font-size:13px;color:var(--sub)}
.hide{display:none!important}
.sheet h3{border-bottom:2px solid var(--sun);padding-bottom:2px}
.sheet p,.sheet li{margin:2px 0}
.demos{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}
.demo{text-align:center;max-width:150px}
.demo .col{display:inline-flex;flex-direction:column;border:2px solid var(--blue);border-radius:4px;background:#fff}
.mas{width:38px;height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;writing-mode:vertical-rl;color:var(--ink)}
.mas:last-child{border-bottom:0}
.mas.eng{writing-mode:horizontal-tb;font-size:15px;letter-spacing:-1px}
.demo .cap{font-size:12px;color:var(--sub);line-height:1.4;margin-top:4px}
.feat{background:var(--blue-l);border-radius:12px;padding:10px 12px;margin:10px 0}
.feat dt{font-weight:700;color:var(--blue-d)} .feat dd{margin:0 0 6px}
.pill.tag{background:var(--blue-l);border-color:var(--blue)}

.notebook{display:flex;flex-direction:column;gap:14px}
.sheet{display:contents}
.face{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px}
.face.cover{order:1}.face.p2{order:2}.face.p3{order:3}.face.back{order:4}
.fbar{color:#fff;font-weight:700;font-size:14px;padding:4px 10px;border-radius:6px;margin:12px 0 6px}
.fbar.blue{background:var(--blue)}.fbar.sun{background:var(--sun);color:#5a4200}.fbar.mint{background:var(--mint)}.fbar.coral{background:var(--coral)}
.fld{margin:6px 0}.fl{font-weight:700;font-size:14px}.fl small{font-weight:400;color:var(--sub)}
.face .ro{border:2px solid var(--line);border-radius:8px;min-height:38px;padding:6px 10px;background:#fcfeff}
.face .two{display:flex;gap:8px}
.face h4{margin:10px 0 2px;color:var(--blue-d)}
.face ul{margin:2px 0 2px 18px;padding:0;font-size:14px}.face ul.sm{font-size:13px}
.hl{border-radius:8px;padding:6px 10px;margin:4px 0;font-size:14px}.hl.b{background:var(--blue-l)}.hl.y{background:var(--sun-l)}.hl.c{background:var(--coral-l)}
.ttl{font-size:22px;font-weight:700;color:var(--blue-d);text-align:center;margin-top:16px}.ttl2{font-size:28px;font-weight:700;color:var(--coral);text-align:center}
.c{text-align:center}.r{text-align:right;font-weight:700;color:var(--blue-d)}
.chk.sm label{padding:3px 9px;font-size:14px}
.btn{text-decoration:none}
.gk-all{display:flex;flex-direction:column;gap:14px}
.gk-wrap{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.gk{display:flex;flex-direction:row-reverse;width:max-content;border:2px solid var(--blue);background:#fff}
.gk-col{display:flex;flex-direction:column;border-left:1px solid var(--blue)}
.gk-col:last-child{border-left:0}
.gk-c{width:30px;height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;writing-mode:vertical-rl;color:var(--ink);line-height:1}
.gk-c.eng{writing-mode:horizontal-tb;font-size:13px;letter-spacing:-1px}
.gk-c.over{outline:2px solid var(--coral);outline-offset:-2px;font-size:13px}
.gk-no{text-align:right;margin-top:2px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0}
.score .big{font-size:44px;font-weight:700;line-height:1;color:var(--blue-d)}
.score .big small{font-size:18px;color:var(--sub);font-weight:400}
.sitems{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.sitems td,.sitems th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.sitems th{color:var(--sub);font-weight:700;font-size:13px}
.sitems td.n{white-space:nowrap;font-weight:700;text-align:right}
.hist{margin:8px 0}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:8px 0;font-size:14px}
.hrow .no{flex:0 0 3.2em;color:var(--sub)}
.hrow .bar{position:relative;flex:1 1 120px;min-width:120px;height:22px;background:var(--line);border-radius:6px;overflow:hidden}
.hrow .bar i{display:block;height:100%;background:var(--blue)}
.hrow .bar i.ok{background:var(--mint)}
.hrow .bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--coral)}
.hrow .bar u.l85{background:var(--sun)}
.hrow .pt{flex:0 0 3.4em;font-weight:700;text-align:right}
.hrow .meta{flex:1 1 100%;font-size:12px;color:var(--sub);padding-left:3.7em}
@media print{
  @page note{size:364mm 257mm;margin:6mm}
  .notebook{page:note;display:block}
  .sheet{display:grid;grid-template-columns:1fr 1fr;gap:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .face{order:0!important;border:1px dashed #9ccbe6;border-radius:0;min-height:243mm;padding:8mm;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fbar,.hl,.chk label{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .face textarea,.face input[type=text],.face input[type=number]{border:1.5px solid #9ccbe6;font-size:12px;background:#fff;resize:none;overflow:hidden}
  .face ul{font-size:11px}
  main{padding:0;max-width:none}
}
@media print{
  header,nav,.noprint,.btn{display:none!important}
  body{background:#fff}.card{border:1px solid #999}
}
</style>
</head>
<body>
<header>
  <h1>🌸 看護学校 作文・小論文 GAMBA</h1>
  <p>江原予備校　熊本県の正看護・准看護学校 受験対策</p>
</header>
<nav id="nav" class="hide"></nav>
<main id="app"></main>

<script src="schools.js"></script>
<script src="features.js"></script>
<script src="lessons.js"></script>
<script>
(function(){
"use strict";
var app=document.getElementById("app"), nav=document.getElementById("nav");
var S={consent:false, tab:"home", kindFilter:"all", sel:[], lessonKey:null, lessonIdx:0, done:{}};
var D={}; // 入力内容（画面内のみ）

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nl(s){return esc(s).replace(/\n/g,"<br>")}
function byId(id){for(var i=0;i<SCHOOLS.length;i++)if(SCHOOLS[i].id===id)return SCHOOLS[i]}
function stopped(s){return /募集停止|閉校/.test(s.exam+s.message)&&s.kind==="准看"&&/募集停止（|募集停止済み|2026年度入学生を最後/.test(s.exam+s.message)}

// 個人情報パターン検出
var PII=[/0\d{1,4}[-ー−\s]?\d{1,4}[-ー−\s]?\d{3,4}/, /\d{3}[-ー−]\d{4}/, /[\w.+-]+@[\w-]+\.[\w.]+/, /〒/, /(県|市|町|村)[^\s]{0,8}(\d+丁目|\d+番地|\d+-\d+)/];
function hasPII(t){for(var i=0;i<PII.length;i++)if(PII[i].test(t||""))return true;return false}

var TABS=[["home","🏠 ホーム"],["sakubun","✏️ 作文の基礎"],["shouron","📝 小論文の基礎"],["genkou","🗒 原稿用紙のルール"],["research","🏫 志望校リサーチ"],["input","📓 素材ノート"],["sheet","📄 素材シート"],["essay","✍ 原稿用紙・採点"]];
function drawNav(){
  nav.className=S.consent?"":"hide";
  nav.innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){b.onclick=function(){go(b.getAttribute("data-t"))}});
}
function go(t){S.tab=t; if(t==="sakubun"||t==="shouron"||t==="genkou"){S.lessonKey=t;S.lessonIdx=0} render(); window.scrollTo(0,0)}

function render(){
  drawNav();
  if(!S.consent){app.innerHTML=viewConsent();bindConsent();return}
  var v={home:viewHome,sakubun:viewLesson,shouron:viewLesson,genkou:viewLesson,research:viewResearch,input:viewInput,sheet:viewSheet,essay:viewEssay}[S.tab];
  app.innerHTML=v();
  var b={home:bindHome,sakubun:bindLesson,shouron:bindLesson,genkou:bindLesson,research:bindResearch,input:bindInput,sheet:bindSheet,essay:bindEssay}[S.tab];
  if(b)b();
}

/* ---------- 同意 ---------- */
function viewConsent(){return '<div class="card warn"><h2 style="color:#c8402f">⚠️ はじめに必ずお読みください</h2>'+
 '<p><b>この画面には、住所・氏名・電話番号・メールアドレス・生年月日などの個人情報を、絶対に書かないでください。</b></p>'+
 '<ul><li>学校名・会社名は、書かなくても大丈夫です（書く場合は任意です）。</li><li>お子さんの名前や年齢の詳しい情報も書かないでください。人数だけで十分です。</li><li>入力した内容は、あなたの端末の画面の中だけで使われます。このプログラムは、内容を外部に送信しません。</li><li>ブラウザを閉じると、入力した文章は消えます。必要な場合は、画面の「印刷」や「テキスト保存」を使ってください。</li><li>ただし、採点の<b>点数の記録だけ</b>は、この端末のブラウザに残します（文章そのものは保存しません）。共用のパソコンでは、使い終わったら記録を消してください。</li></ul></div>'+
 '<div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:700"><input type="checkbox" id="agree" style="width:24px;height:24px;margin-top:4px"> <span>上の内容を読み、個人情報は書かないことに同意します。</span></label>'+
 '<p style="margin-top:14px"><button class="btn" id="go" disabled>同意して始める</button></p></div>'}
function bindConsent(){var a=document.getElementById("agree"),g=document.getElementById("go");a.onchange=function(){g.disabled=!a.checked};g.onclick=function(){S.consent=true;S.tab="home";render()}}

/* ---------- ホーム ---------- */
function viewHome(){
  var steps=[["research","🏫","① 志望校を調べる","理念・求める学生像・合格率・入試の形式を比べます。"],
             ["sakubun","✏️","② 作文の基礎","短く、具体的に、4つの段落で書く練習です。"],
             ["shouron","📝","③ 小論文の基礎","意見と理由を、型にそって書く練習です。"],
             ["input","📓","④ 素材ノートに書く","B4二つ折りのノートに、経験・つらかったこと・強みを書き出します。スマホで書いて、印刷もできます。"],
             ["sheet","📄","⑤ 素材シートを作る","入力内容と志望校のキーワードをつなぎ、作文の下書きに進みます。"],
             ["essay","✍","⑥ 原稿用紙で書く・採点","スマホで文章を打つと、縦書きの原稿用紙に割り付けます。書き方のチェック採点（100点満点）をして、点数を記録し、目標の85点を目指して繰り返し練習します。"]];
  return '<div class="card"><h2>ようこそ</h2><p>看護学校の作文・小論文は、「うまい文章」より「あなたの経験と気持ち」が大切です。順番に進めれば、下書きまでたどりつけます。</p></div>'+
  '<div class="grid two">'+steps.map(function(s){return '<button class="tile" data-go="'+s[0]+'"><span class="ic">'+s[1]+'</span><b>'+s[2]+'</b>'+s[3]+'</button>'}).join("")+'</div>'+
  '<div class="tip">学校の情報は'+SCHOOLS_UPDATED+'時点の公開資料です。出願前には、必ず各学校の最新の募集要項をご確認ください。</div>'}
function bindHome(){Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){go(b.getAttribute("data-go"))}})}

/* ---------- レッスン ---------- */
function demoHtml(p){
  if(!p.demo)return "";
  return '<h3>原稿用紙の見え方（縦書き・上から下へ）</h3><div class="demos">'+p.demo.map(function(d){
    return '<div class="demo"><div class="col">'+d.cells.map(function(c){return '<span class="mas'+(d.eng?' eng':'')+'">'+esc(c)+'</span>'}).join("")+'</div><div class="cap">'+esc(d.cap)+'</div></div>'}).join("")+'</div>'}
function viewLesson(){
  var L=LESSONS[S.lessonKey], i=S.lessonIdx, p=L.pages[i], n=L.pages.length;
  var doneN=Object.keys(S.done).filter(function(k){return k.indexOf(S.lessonKey)===0}).length;
  return '<div class="card"><h2>'+esc(L.title)+'　<span class="small">'+(i+1)+' / '+n+'</span></h2><div class="progress"><i style="width:'+Math.round((i+1)/n*100)+'%"></i></div>'+
  '<h3 style="font-size:18px">'+esc(p.t)+'</h3>'+
  '<div class="tip"><b>ポイント</b><br>'+nl(p.point)+'</div>'+
  '<h3>解説</h3><p>'+nl(p.explain)+'</p>'+
  '<h3>例</h3><pre class="ex">'+esc(p.ex)+'</pre>'+demoHtml(p)+
  '<h3>練習</h3><p>'+nl(p.ps)+'</p><textarea id="ans" placeholder="ここに書いてみましょう（保存されません）"></textarea>'+
  '<h3>できたかな？</h3><div class="chk">'+p.ck.map(function(c,k){return '<label><input type="checkbox" class="ck" data-k="'+k+'"> '+esc(c)+'</label>'}).join("")+'</div>'+
  '<p style="margin-top:16px"><button class="btn line" id="prev" '+(i===0?"disabled":"")+'>← 前へ</button> '+
  (i<n-1?'<button class="btn" id="next">次へ →</button>':'<button class="btn sun" id="fin">このコースを終える</button>')+'</p></div>'}
function bindLesson(){
  var p=document.getElementById("prev"),nx=document.getElementById("next"),f=document.getElementById("fin");
  if(p)p.onclick=function(){S.lessonIdx--;render();window.scrollTo(0,0)};
  if(nx)nx.onclick=function(){S.done[S.lessonKey+S.lessonIdx]=1;S.lessonIdx++;render();window.scrollTo(0,0)};
  if(f)f.onclick=function(){S.done[S.lessonKey+S.lessonIdx]=1;go(S.lessonKey==="sakubun"?"shouron":(S.lessonKey==="shouron"?"genkou":"input"))};
}

/* ---------- 志望校リサーチ ---------- */
function badge(s){return '<span class="badge '+(s.kind==="正看"?"b-sei":"b-jun")+'">'+s.kind+'</span>'+(/募集停止|閉校/.test(s.exam+s.message)&&s.kind==="准看"&&!/令和9年度入試が最後/.test(s.message)?'<span class="badge b-stop">募集停止・閉校予定</span>':'')}
function viewResearch(){
  var list=SCHOOLS.filter(function(s){return S.kindFilter==="all"||s.kind===S.kindFilter});
  var h='<div class="card"><h2>志望校リサーチ</h2><p>学校を選ぶと、<b>理念・求める学生像・学校が強調したい点・入試の作文／小論文</b>がまとまります。最大3校まで、志望校に登録できます。</p>'+
  '<div class="chk" id="kf">'+[["all","すべて"],["正看","正看護師"],["准看","准看護師"]].map(function(k){return '<label><input type="radio" name="kf" value="'+k[0]+'" '+(S.kindFilter===k[0]?"checked":"")+'> '+k[1]+'</label>'}).join("")+'</div></div>';
  h+='<div class="card"><h3>志望校に登録中：'+(S.sel.length?S.sel.map(function(id){return esc(byId(id).name)}).join("／"):"（まだありません）")+'</h3></div>';
  h+=list.map(function(s){var on=S.sel.indexOf(s.id)>=0;
    return '<div class="card"><div>'+badge(s)+'<b style="font-size:17px">'+esc(s.name)+'</b></div>'+
    '<p class="small">'+esc(s.course)+'｜'+esc(s.area)+'｜修業年限 '+esc(s.years)+'｜定員 '+esc(s.cap)+'</p>'+
    '<div class="row">'+(s.feat?s.feat.tags:[]).map(function(t){return '<span class="pill tag">'+esc(t)+'</span>'}).join("")+'</div>'+
    '<div class="ok"><b>学校が強調したい点</b>（公開資料からの読み取り）<ul style="margin:4px 0 0 18px;padding:0">'+s.emphasis.map(function(e){return '<li>'+esc(e)+'</li>'}).join("")+'</ul></div>'+

var NOHEAD="、。，．」』）】！？";
function layoutGenkou(text){
  var cols=[], col=[];
  function newCol(){if(col.length)cols.push(col);col=[]}
  var brk=false;
  function put(ch){
    var isAscii=/^[A-Za-z0-9.]$/.test(ch);
    if(isAscii&&col.length&&!brk){var last=col[col.length-1];if(last.eng&&last.t.length<2&&!last.over){last.t+=ch;return}}
    brk=false;
    if(col.length>=20){
      if(NOHEAD.indexOf(ch)>=0){var l=col[col.length-1];l.t+=ch;l.over=true;return}
      newCol();
    }
    col.push({t:ch,eng:isAscii,over:false});
  }
  var paras=text.split("\n");
  paras.forEach(function(p,pi){
    if(p.replace(/\s/g,"")===""){ if(pi<paras.length-1&&col.length){newCol()} return}
    if(col.length)newCol();
    col.push({t:"",eng:false,over:false}); // 段落の初めは1マス空ける
    for(var i=0;i<p.length;i++){var ch=p[i];if(ch===" "||ch==="　"){brk=true;continue}put(ch)}
  });
  if(col.length)cols.push(col);
  return cols}
function genkouWarn(t){
  var w=[];
  if(/(食べ|見|来|出|寝|起き|着|考え|答え|比べ)れ(る|ない|ます|た|て)/.test(t))w.push("「ら抜き言葉」かもしれません（食べられる、見られる、など）。");
  if(/[0-9０-９]{2,}\s*(年|月|日|人|歳|％|%)/.test(t))w.push("縦書きでは、数字は漢数字で書くのが基本です（例：二〇一八年）。学校の指示も確認しましょう。");
  if(/二千[^\s]{0,4}年/.test(t))w.push("西暦は「二千十八年」ではなく「二〇一八年」と書きます。");
  if(/(です|ます)(。|$)/m.test(t)&&/(だ|である)。/.test(t))w.push("「です・ます」と「だ・である」が混ざっています。どちらかにそろえましょう（小論文は「だ・である」）。");
  if(/\n\s*\n/.test(t)===false&&t.length>400)w.push("段落が1つだけです。4つ前後に分けると読みやすくなります。");
  return w}

function endsPolite(x){return /(です|ます|でした|ました|ません|ましょう|でしょう)$/.test(x)}
function scoreEssay(text,kind){
  var t=text.replace(/\r/g,"").trim(), chars=t.replace(/[\s\n]/g,"").length, items=[];
  var lim=parseInt(D.chars)||0, sens=splitSentences(t), paras=t.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);
  function add(name,max,got,msg){items.push({name:name,max:max,got:Math.max(0,Math.min(max,got)),msg:msg})}
  // 1 字数
  if(!lim)add("字数",0,0,"字数の制限を入れると判定します（この項目は点数に入れていません）。");
  else{var r=chars/lim,g,m;
    if(chars<30){g=0;m="まだ書き始めたところです。"}
    else if(r>1){g=0;m="制限（"+lim+"字）を"+(chars-lim)+"字オーバーしています。"}
    else if(r>=0.8){g=20;m="制限の8割以上、制限以内で書けています。"}
    else if(r>=0.6){g=12;m="あと"+(Math.ceil(lim*0.8)-chars)+"字で8割です。"}
    else if(r>=0.4){g=6;m="字数が足りません。あと"+(Math.ceil(lim*0.8)-chars)+"字で8割です。"}
    else{g=2;m="字数が大きく足りません。"}
    add("字数",20,g,m)}
  // 2 文体
  var nP=sens.filter(endsPolite).length, nD=sens.length-nP, minor=Math.min(nP,nD), g2,m2;
  if(!sens.length){g2=0;m2="文がまだありません。"}
  else if(minor>=2){g2=0;m2="「です・ます」と「だ・である」が混ざっています。"}
  else if(minor===1&&nP>0&&nD>0){g2=7;m2="1か所だけ文体が混ざっています。そろえましょう。"}
  else if(nP===0){g2=15;m2="「だ・である」調でそろっています。"}
  else if(kind==="小論文"){g2=5;m2="小論文は「だ・である」調で書きます。"}
  else{g2=10;m2="「です・ます」でそろっています。基本の「だ・である」調にそろえると、より整います。"}
  add("文体の統一",15,g2,m2);
  // 3 表記
  var g3=15,n3=[];
  if(/(食べ|見|来|出|寝|起き|着|考え|答え|比べ)れ(る|ない|ます|た|て)/.test(t)){g3-=4;n3.push("ら抜き言葉")}
  if(/(でも、|だから、|やっぱり|すごく|ちゃう|じゃない|っていう|なんか|けど、|いっぱい|ちょっと)/.test(t)){g3-=4;n3.push("話し言葉")}
  if(/[！？!?]/.test(t)){g3-=3;n3.push("「！」「？」")}
  if(/[0-9０-９]{2,}\s*(年|月|日|人|歳|％|%)/.test(t)){g3-=2;n3.push("縦書きは漢数字（学校の指示も確認）")}
  if(/二千[^\s]{0,4}年/.test(t)){g3-=2;n3.push("西暦の書き方")}
  add("表記・言葉づかい",15,g3,n3.length?("見直し：" + n3.join("、")+"。"):"表記の問題は見つかりませんでした。");
  // 4 段落
  var n=paras.length,g4,m4;
  if(chars<150){g4=n>=1?8:0;m4="文章が短いため、段落は判定しません（目安）。"}
  else if(n===4){g4=15;m4="4つの段落で書けています。"}
  else if(n===3||n===5){g4=12;m4=n+"段落です。4つ前後が目安です。"}
  else if(n===2){g4=7;m4="2段落です。きっかけ・経験・学び・これから、の4つに分けましょう。"}
  else if(n===1){g4=0;m4="段落が1つです。改行して4つ前後に分けましょう。"}
  else{g4=8;m4=n+"段落です。多すぎるので、まとめましょう。"}
  add("段落の構成",15,g4,m4);
  // 5 文の長さ
  var g5=0,m5="文がまだありません。";
  if(sens.length){var tot=sens.reduce(function(a,x){return a+x.length},0),avg=tot/sens.length,mx=Math.max.apply(null,sens.map(function(x){return x.length}));
    g5=avg<=50?10:avg<=60?8:avg<=70?5:2; if(mx>100)g5-=3;
    m5="平均"+Math.round(avg)+"字、いちばん長い文は"+mx+"字です。"+(g5<10?"短く区切りましょう（目安は1文40〜60字）。":"")}
  add("文の長さ",10,g5,m5);
  // 6 内容
  var schools=S.sel.map(byId),kw=[];schools.forEach(function(sc){sc.keywords.forEach(function(k){if(kw.indexOf(k)<0&&k.indexOf("要確認")<0)kw.push(k)})});
  var used=kw.filter(function(k){return k.split(/[・／\/]/).some(function(w){return w.length>=2&&t.indexOf(w)>=0})});
  if(!kw.length)add("志望校の言葉",0,0,"志望校を登録すると、志望校の言葉を使えているか判定します（この項目は点数に入れていません）。");
  else add("志望校の言葉",8,used.length>=2?8:used.length===1?5:0,used.length?("使えた言葉："+used.join("、")+"。"):"志望校の言葉が入っていません（例："+kw.slice(0,3).join("、")+"）。");
  var nurse=["看護","患者","医療","ケア","寄り添"].filter(function(k){return t.indexOf(k)>=0}).length;
  add("看護の視点",4,nurse>=2?4:nurse===1?2:0,nurse?"看護の言葉が入っています。":"看護・患者さんの視点の言葉を入れましょう。");
  if(kind==="小論文"){
    var op=/(と考える|と思う|べきだ|必要がある|重要だ|大切だ|重要である|大切である|ではないか)/.test(t), re=/(なぜなら|理由は|からである|ためである|そのため|したがって|例えば|たとえば)/.test(t);
    add("意見と理由",8,(op?4:0)+(re?4:0),(op?"意見は書けています。":"意見（〜と考える）をはっきり書きましょう。")+(re?"理由・例も入っています。":"理由や例（なぜなら、例えば）を入れましょう。"))}
  else{
    var ex=/(経験|頑張|部活|仕事|ボランティア|サークル|アルバイト)/.test(t), le=/(学び|学んだ|身につ|気づ|成長)/.test(t);
    add("経験と学び",8,(ex?4:0)+(le?4:0),(ex?"経験が書けています。":"自分の経験を具体的に書きましょう。")+(le?"学びも入っています。":"経験から学んだことを書きましょう。"))}
  // 7 敬称
  var bad=/(御校|御学|あなたの学校|そちらの学校|貴方の学校)/.test(t);
  add("敬称",5,bad?0:5,bad?"学校は「貴校」、大学は「貴学」と書きます。":"問題は見つかりませんでした。");
  var sum=0,mx2=0;items.forEach(function(x){sum+=x.got;mx2+=x.max});
  var tot2=mx2?Math.round(sum/mx2*100):0,capped=false;if(lim&&chars<lim*0.5&&tot2>60){tot2=60;capped=true}
  return {total:tot2,items:items,chars:chars,judged:mx2,capped:capped}}
var lastScore=null;
function renderScore(sc,kind){
  var rest=sc.total>=GOAL?'<div class="ok"><b>目標の'+GOAL+'点に届きました。</b>この調子で、別のテーマでも書いてみましょう。</div>':
           sc.total>=PASS_LINE?'<div class="tip"><b>'+PASS_LINE+'点を超えました。</b>あと'+(GOAL-sc.total)+'点で目標の'+GOAL+'点です。</div>':
           '<div class="tip">'+PASS_LINE+'点まであと'+(PASS_LINE-sc.total)+'点です。下の「見直すところ」を直して、もう一度採点しましょう。</div>';
  var rows=sc.items.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+(x.max?x.got+' / '+x.max:'―')+'</td><td>'+esc(x.msg)+'</td></tr>'}).join("");
  return '<div class="card noprint"><h2>✅ 採点結果（'+esc(kind)+'）</h2><div class="score"><div class="big">'+sc.total+'<small> 点 / 100点</small></div></div>'+rest+
   (sc.capped?'<div class="tip">字数が制限の半分に届いていないため、60点を上限にしています。</div>':'')+'<table class="sitems"><tr><th>項目</th><th>点</th><th>コメント</th></tr>'+rows+'</table>'+
   '<p class="small">この採点は、字数・文体・表記・段落・文の長さ・志望校の言葉など、<b>書き方の形式</b>をプログラムでチェックするものです。内容のよしあし（志望動機の深さ、具体性、説得力）は点数に入りません。内容は、講師が添削します。</p>'+
   '<p><button class="btn" id="esrec">この点数を記録する</button></p></div>'}
function renderHist(){
  var h=loadHist(), el=document.getElementById("eshist"); if(!el)return;
  if(!h.length){el.innerHTML='<p class="small">まだ記録がありません。採点して「この点数を記録する」を押すと、ここに並びます。目標は'+GOAL+'点（'+PASS_LINE+'点以上で合格圏）です。3〜4回の練習で伸ばしていきましょう。</p>';return}
  var best=Math.max.apply(null,h.map(function(x){return x.s}));
  el.innerHTML='<p>練習回数：<b>'+h.length+'回</b>　最高点：<b>'+best+'点</b></p><div class="hist">'+h.map(function(x,i){
    return '<div class="hrow"><span class="no">'+(i+1)+'回目</span><span class="bar"><i class="'+(x.s>=GOAL?'ok':'')+'" style="width:'+x.s+'%"></i><u style="left:'+PASS_LINE+'%"></u><u class="l85" style="left:'+GOAL+'%"></u></span><span class="pt">'+x.s+'点</span><span class="meta">'+esc(x.d)+'・'+esc(x.k)+(x.t?'・'+esc(x.t):'')+'</span></div>'}).join("")+'</div>'+
    '<p class="small">赤い線は'+PASS_LINE+'点、黄色い線は目標の'+GOAL+'点です。この記録は、この端末のブラウザにだけ残ります（文章は保存しません）。</p>'+
    '<p><button class="btn line" id="eshdl">記録をテキスト保存</button> <button class="btn line" id="eshclr">記録を消す</button></p>';
  document.getElementById("eshdl").onclick=function(){var tx="【作文・小論文 採点記録】\n"+h.map(function(x,i){return (i+1)+"回目　"+x.d+"　"+x.k+"　"+x.s+"点　"+x.c+"字　"+(x.t||"")}).join("\n");var b=new Blob([tx],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="score-record.txt";document.body.appendChild(a);a.click();document.body.removeChild(a)};
  document.getElementById("eshclr").onclick=function(){if(confirm("点数の記録をすべて消します。よろしいですか？")){saveHist([]);renderHist()}}}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function bindEssay(){
  var t=document.getElementById("es"),info=document.getElementById("esinfo"),pv=document.getElementById("espreview");
  t.oninput=function(){D.essay=t.value;var r=essayView(t.value);info.innerHTML=r.info;pv.innerHTML=r.prev;
    var bad=hasPII(t.value),el=document.getElementById("piiwarn");el.className=bad?"card warn":"hide";el.innerHTML=bad?'<b>電話番号・住所・メールアドレスのような文字が見つかりました。消してください。</b>':""};
  document.getElementById("espr").onclick=function(){window.print()};
  var ek=document.getElementById("eskind"),ec=document.getElementById("eschars"),et=document.getElementById("estheme");
  ek.onchange=function(){D.exam=ek.value};
  ec.oninput=function(){D.chars=ec.value;var r=essayView(t.value);info.innerHTML=r.info};
  et.oninput=function(){D.theme=et.value};
  renderHist();
  document.getElementById("esscorebtn").onclick=function(){
    var box=document.getElementById("esscore");
    if(hasPII(t.value+" "+et.value)){alert("個人情報が含まれているようです。消してから採点してください。");return}
    if(t.value.replace(/\s/g,"").length<30){alert("文章をもう少し書いてから採点しましょう（30字以上）。");return}
    var kind=ek.value; lastScore=scoreEssay(t.value,kind); lastScore.kind=kind;
    box.innerHTML=renderScore(lastScore,kind);
    var rb=document.getElementById("esrec");
    rb.onclick=function(){var h=loadHist();h.push({d:today(),k:kind,s:lastScore.total,c:lastScore.chars,t:(et.value||"").slice(0,30)});if(h.length>50)h=h.slice(h.length-50);saveHist(h);rb.disabled=true;rb.textContent="記録しました";renderHist()};
    box.scrollIntoView({behavior:"smooth",block:"start"})};
  document.getElementById("estxt").onclick=function(){var b=new Blob([D.essay||""],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="essay.txt";document.body.appendChild(a);a.click();document.body.removeChild(a)};
}

/* ---------- 素材シート ---------- */
function bullets(t){return (t||"").split(/\n+/).map(function(x){return x.replace(/^[・\-\*•\s]+/,"").trim()}).filter(Boolean)}
function sheetText(){
  var t=[],A=function(a){t.push(a)};
  A("【素材シート】看護学校 作文・小論文");
  A("志望校："+(S.sel.length?S.sel.map(function(id){return byId(id).name}).join("、"):"（未登録）"));
  A("\n■ 学歴\n種類："+(D.school||"")+"　学科："+(D.dept||"")+"　高認："+(D.kounin||""));
  A("\n■ 部活動\n部活動："+(D.club||"")+"\n戦績："+(D.prize||"")+"\n役職："+(D.post||"")+(D.postName?"（"+D.postName+"）":""));
  A("\n■ 仕事\n雇用の形："+(D.job||"")+"\n経験："+(D.jobhist||"")+(D.company?"（"+D.company+"）":"")+"\n担った仕事："+(D.duty||""));
  A("\n■ つらかったこと\n"+(D.hard||"")+"\n\n■ 乗り越え方\n"+(D.overcome||"")+"\n\n■ 看護師として役立つこと\n"+(D.useful||""));
  A("\n■ 家庭\nお子さん："+(D.kids||"")+(D.kidsN?"（"+D.kidsN+"人）":"")+"　ひとり親："+(D.single||""));
  A("\n■ 入学後の不安\n"+((D.worry||[]).join("、"))+"\n"+(D.worryText||""));
  A("\n■ 自己PR\n"+bullets(D.pr).map(function(x){return "・"+x}).join("\n")+"\n\n■ 頑張ったこと\n"+(D.effort||"")+"\n\n■ 研究・探究\n"+(D.research||""));
  return t.join("\n")}
function themes(){
  var base=["あなたが看護師を目指す理由を述べなさい。","これまでに頑張ったことと、そこから学んだことを述べなさい。","理想の看護師像について、あなたの考えを述べなさい。","入学後、どのように学び、どんな看護師になりたいかを述べなさい。"];
  var ron=["高齢化社会で看護師に求められる役割について述べなさい。","チーム医療で大切なことは何か、あなたの考えを述べなさい。","患者さんとのコミュニケーションで大切なことを述べなさい。","医療現場でのICT活用について、あなたの考えを述べなさい。"];
  return {sakubun:base,shouron:ron}}
function viewSheet(){
  var schools=S.sel.map(byId);
  var kw=[];schools.forEach(function(s){s.keywords.forEach(function(k){if(kw.indexOf(k)<0&&k.indexOf("要確認")<0)kw.push(k)})});
  var em=[];schools.forEach(function(s){s.emphasis.forEach(function(e){em.push(s.name+"：" +e)})});
  var pr=bullets(D.pr), th=themes();
  var h='<div class="card sheet" id="sheetbox"><h2>素材シート</h2>'+
  '<h3>志望校</h3><p>'+(schools.length?schools.map(function(s){return esc(s.name)+'（'+esc(s.essay)+'）'}).join("<br>"):'まだ登録していません。「志望校リサーチ」で登録しましょう。')+'</p>'+
  '<h3>学歴・活動</h3><p>'+esc(D.school||"―")+'／'+esc(D.dept||"―")+'／高認：'+esc(D.kounin||"―")+'<br>部活動：'+esc(D.club||"―")+'　戦績：'+esc(D.prize||"―")+'　役職：'+esc(D.post||"―")+(D.postName?'（'+esc(D.postName)+'）':'')+'</p>'+
  '<h3>仕事</h3><p>'+esc(D.job||"―")+'／'+esc(D.jobhist||"―")+(D.company?'（'+esc(D.company)+'）':'')+'<br>担った仕事：'+nl(D.duty||"―")+'</p>'+
  '<h3>つらかったこと → 乗り越え方 → 看護師として</h3><p><b>つらかったこと：</b>'+nl(D.hard||"―")+'</p><p><b>乗り越え方：</b>'+nl(D.overcome||"―")+'</p><p><b>看護師に役立つこと：</b>'+nl(D.useful||"―")+'</p>'+
  '<h3>家庭・不安</h3><p>お子さん：'+esc(D.kids||"―")+(D.kidsN?'（'+esc(D.kidsN)+'人）':'')+'／ひとり親：'+esc(D.single||"―")+'<br>不安：'+esc((D.worry||[]).join("、")||"―")+'<br>'+nl(D.worryText||"")+'</p>'+
  '<h3>自己PR</h3>'+(pr.length?'<ul>'+pr.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>':'<p>―</p>')+
  '<p><b>頑張ったこと：</b>'+nl(D.effort||"―")+'</p><p><b>研究・探究：</b>'+nl(D.research||"―")+'</p></div>'+

  '<div class="card"><h2>作文の下書きガイド</h2><p class="small">あなたの入力と、志望校の特徴をつなげた「構成メモ」です。この順に、自分の言葉で書いてみましょう。</p>'+
  '<div class="tip"><b>志望校がよく使う言葉</b><div class="row">'+(kw.length?kw.map(function(k){return '<span class="pill">'+esc(k)+'</span>'}).join(""):'（志望校を登録すると表示されます）')+'</div>'+
  (em.length?'<div class="small" style="margin-top:6px">学校が強調したい点：<br>'+em.map(esc).join("<br>")+'</div>':'')+
  (schools.length?'<div class="small" style="margin-top:6px">学校の特徴（志望理由に使えます）：<br>'+schools.map(function(s){return esc(s.name)+'：'+esc(s.feat.tags.join("／"))}).join("<br>")+'</div>':'')+'</div>'+
  '<h3>① きっかけ</h3><p class="small">看護師を目指したきっかけを1〜2文で。</p>'+
  '<h3>② 経験</h3><pre class="ex">頑張ったこと：'+esc(D.effort||"（素材を入力しましょう）")+'\nつらかったこと：'+esc(D.hard||"―")+'\n乗り越え方：'+esc(D.overcome||"―")+'</pre>'+
  '<h3>③ 学び</h3><pre class="ex">経験から身についた力：'+esc(pr.slice(0,3).join("、")||"―")+'\n看護師として役立つこと：'+esc(D.useful||"―")+'</pre>'+
  '<h3>④ これから</h3><pre class="ex">入学後の不安への備え：'+esc((D.worry||[]).join("、")||"―")+'\n志望校の言葉を使って、抱負を書きましょう：'+esc(kw.slice(0,3).join("、")||"―")+'</pre>'+
  '<h3>練習用のテーマ</h3><p><b>作文</b></p><ul>'+th.sakubun.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul><p><b>小論文</b></p><ul>'+th.shouron.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'+
  '<div class="tip">この下書きを先生に見せると、添削を受けられます。書いた文章は「原稿用紙・採点」で書き方をチェックし、点数を記録できます。</div></div>'+
  '<p class="noprint"><button class="btn" id="print">🖨 印刷する</button> <button class="btn line" id="txt">テキスト保存</button> <button class="btn line" id="copy">コピー</button></p>';
  return h}
function bindSheet(){
  document.getElementById("print").onclick=function(){window.print()};
  document.getElementById("copy").onclick=function(){var t=sheetText();if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert("コピーしました")},function(){alert("コピーできませんでした")});else alert("お使いの環境ではコピーできません。テキスト保存を使ってください。")};
  document.getElementById("txt").onclick=function(){var b=new Blob([sheetText()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sozai-sheet.txt";document.body.appendChild(a);a.click();document.body.removeChild(a)};
}

render();
})();
