<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>合言葉をつくる</title>
<style>body{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f3fbff;color:#26364a;max-width:640px;margin:0 auto;padding:20px;line-height:1.8}
input{width:100%;font-size:18px;padding:10px;border:2px solid #d7e8f3;border-radius:10px}
.btn{background:#3aa9e8;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;padding:12px 20px;cursor:pointer;margin-top:10px}
code{display:block;word-break:break-all;background:#fff6d6;border:2px solid #ffc93c;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.card{background:#fff;border:2px solid #d7e8f3;border-radius:16px;padding:16px;margin:14px 0}</style></head>
<body><h1>🔑 合言葉をつくる（先生用）</h1>
<div class="card"><p>新しい合言葉を入れて「つくる」を押すと、下に長い文字列が出ます。これを <b>config.js</b> の <b>hash</b> の " " の中に貼りつけて、保存してください。</p>
<input id="w" type="text" placeholder="新しい合言葉（ひらがな・英数字どちらも可）" autocomplete="off">
<button class="btn" id="b">つくる</button><code id="o">（ここに表示されます）</code></div>
<p style="font-size:13px">※ 大文字・小文字、全角・半角、空白の違いは区別しません。合言葉そのものは、どこにも保存されません。</p>
<script src="gate.js"></script>
<script>document.getElementById("b").onclick=function(){var v=document.getElementById("w").value;if(!gateNorm(v)){document.getElementById("o").textContent="合言葉を入れてください";return}document.getElementById("o").textContent=sha256(gateNorm(v))}</script>
</body></html>
